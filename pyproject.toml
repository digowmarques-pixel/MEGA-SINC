[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "megasinc"
version = "1.0.0"
description = "Mega Sinc — sincronização automática de múltiplas câmeras e gravadores pelo áudio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PySide6>=6.5", "imageio-ffmpeg>=0.4.9"]

[project.scripts]
megasinc = "megasinc.cli:main"

[project.gui-scripts]
megasinc-gui = "megasinc.gui.app:run_gui"

[tool.setuptools.packages.find]
include = ["megasinc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
